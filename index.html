<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Azul Medicals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #0F52BA;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      max-width: 620px;
      padding: 20px;
    }

    img {
      max-width: 300px;
      margin-bottom: 28px;
    }

    .mission {
      font-style: italic;
      font-size: 16.5px;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .email {
      font-size: 15px;
      font-style: normal;
      font-weight: 500;
    }

    .email a {
      color: #0F52BA;
      text-decoration: none;
    }

    .email a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Azul Medicals Logo">

    <div class="mission">
      A global medical devices initiative.<br>
      Committed to supporting patient care and quality of life through responsible partnerships.
    </div>

    <div class="email">
      <a href="mailto:contact@azulmedicals.com">contact@azulmedicals.com</a>
    </div>
  </div>
</body>
</html>
